<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pirámide alimenticia</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="estilos.css" />
    <link rel="stylesheet" href="animaciones.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-4">
          <img
            class="logo"
            src="imagenes/sodicar-logo.svg"
            alt="Logo sodicar"
          />
          <div id="muestranombre"></div>
          <h2 class="titulo">Pirámide Alimenticia y de hábitos saludables</h2>
          <button id="inicio">Iniciar Juego</button>
          <!-- Aquí se mostrará el alimento actual para arrastrar -->
          <div id="alimento">
            <img src="imagenes/piramideCompleta.png" alt="Pirámide con datos" />
          </div>
          <div>
            <button id="nombre">Nombre</button>
          </div>
          <!-- Contador de alimentos restantes -->
          <div id="contador-restantes" class="text-muted small">
            Quedan 12 alimentos
          </div>
        </div>
        <div class="col-8">
          <div id="juego">
            <div class="contenedor-piramide">
              <img
                src="imagenes/pirfinal.png"
                alt="Pirámide alimenticia"
                class="piramide"
              />
              <!-- Zonas interactivas (puedes ajustar tamaños y posiciones en CSS) -->
              <div class="zona" id="zona-1" grupo="1">
                <div class="pegatinas1"></div>
              </div>
              <div class="zona" id="zona-2" grupo="2">
                <div class="pegatinas1"></div>
              </div>
              <div class="zona" id="zona-3" grupo="3">
                <div class="pegatinas"></div>
              </div>
              <div class="zona" id="zona-4" grupo="4">
                <div class="pegatinas"></div>
              </div>
              <div class="zona" id="zona-5" grupo="5">
                <div class="pegatinas"></div>
              </div>
              <div class="zona" id="zona-6" grupo="6">
                <div class="pegatinas"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="alimentos.js"></script>
    <script src="script.js"></script>
    <script src="animaciones.js"></script>
  </body>
</html>
